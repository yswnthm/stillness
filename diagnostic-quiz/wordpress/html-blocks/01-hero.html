<script>
// Kill white gap above hero — zero out all Elementor parent wrapper padding/margin
(function() {
  function killGap() {
    var hero = document.querySelector('.dq-hero');
    if (!hero) return;
    var el = hero.parentElement;
    // Walk up 8 levels max — covers section > container > column > widget-wrap > widget
    for (var i = 0; i < 8; i++) {
      if (!el || el === document.body) break;
      el.style.setProperty('padding-top', '0', 'important');
      el.style.setProperty('margin-top', '0', 'important');
      el.style.setProperty('padding-bottom', '0', 'important');
      el = el.parentElement;
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', killGap);
  } else {
    killGap();
  }
})();
</script>
